<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n-doc="page.home">CarRent</title>
  <meta name="description" content="CarRent — O‘zbekiston bo‘ylab avtomobil ijarasi platformasi">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1e3a8a">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
</head>
<body>
<div class="lp hidden" id="landing">
  <header class="lp-nav">
    <a href="/" class="lp-logo"><span class="logo-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14M6 17l1.5-5.5A2 2 0 0 1 9.4 10h5.2a2 2 0 0 1 1.9 1.5L18 17"/><circle cx="8" cy="17.5" r="1.6"/><circle cx="16" cy="17.5" r="1.6"/><path d="M4 13h2M18 13h2"/></svg></span><span>CAR<b>RENT</b><small data-i18n="lp.brand_sub"></small></span></a>
    <nav class="lp-links"><a href="#lpCollection" data-i18n="lp.nav_cars"></a><a href="#lpTech" data-i18n="lp.nav_tech"></a><a href="#lpExp" data-i18n="lp.nav_exp"></a><a href="/info.html" data-i18n="lp.nav_about"></a></nav>
    <div class="lp-actions"><button class="lp-lang" id="lpLang" type="button">UZ</button><a class="lp-btn ghost" href="/auth.html#login" data-i18n="nav.login"></a><a class="lp-btn" href="/auth.html#register"><span data-i18n="lp.start"></span> ›</a></div>
  </header>

  <section class="lp-hero" id="lpHero">
    <div class="lp-light l1"></div><div class="lp-light l2"></div><div class="lp-light l3"></div>
    <div class="lp-hero-text">
      <span class="lp-eyebrow" data-i18n="home.eyebrow"></span>
      <h1><span data-i18n="lp.h1a"></span><em data-i18n="lp.h1b"></em></h1>
      <p data-i18n="lp.h1_sub"></p>
      <div class="lp-cta"><a class="lp-btn big" href="/cars.html"><span data-i18n="lp.explore"></span> ›</a><a class="lp-btn big ghost" href="/car-form.html" data-i18n="home.cta_earn"></a></div>
      <form class="lp-search" id="lpSearch" role="search">
        <label><span data-i18n="search.where"></span><select id="lpCity" name="city"></select></label>
        <label><span data-i18n="search.start"></span><input type="date" id="lpStart" name="start"></label>
        <label><span data-i18n="search.end"></span><input type="date" id="lpEnd" name="end"></label>
        <button class="lp-btn" type="submit" data-i18n="search.submit"></button>
      </form>
    </div>
    <div class="lp-stage" aria-hidden="true">
      <div class="lp-cars" id="lpCars"></div>
      <div class="lp-floor"></div>
    </div>
    <div class="lp-dots" id="lpDots"></div>
    <div class="lp-stats" id="lpStats"></div>
  </section>

  <section class="lp-sec" id="lpCollection">
    <div class="lp-head reveal"><span class="lp-eyebrow" data-i18n="lp.col_eyebrow"></span><h2 data-i18n="lp.col_title"></h2></div>
    <div class="lp-rail-wrap reveal"><button class="lp-arrow prev" id="lpPrev" type="button" aria-label="‹">‹</button>
      <div class="lp-rail" id="lpRail"></div><button class="lp-arrow next" id="lpNext" type="button" aria-label="›">›</button></div>
    <div class="lp-center reveal"><a class="lp-btn ghost" href="/cars.html"><span data-i18n="home.all_cars"></span> ›</a></div>
  </section>

  <section class="lp-sec" id="lpTech">
    <div class="lp-head reveal"><span class="lp-eyebrow" data-i18n="lp.tech_eyebrow"></span><h2 data-i18n="lp.tech_title"></h2></div>
    <div class="lp-tech" id="lpTechCards"></div>
  </section>

  <section class="lp-exp reveal" id="lpExp">
    <div class="lp-exp-bg"></div>
    <div class="lp-exp-text"><span class="lp-eyebrow" data-i18n="lp.exp_eyebrow"></span><h2 data-i18n="lp.exp_title"></h2><p data-i18n="lp.exp_sub"></p>
      <ol class="lp-steps"><li><b data-i18n="how.s1"></b><span data-i18n="how.s1d"></span></li><li><b data-i18n="how.s2"></b><span data-i18n="how.s2d"></span></li>
        <li><b data-i18n="how.s3"></b><span data-i18n="how.s3d"></span></li><li><b data-i18n="how.s4"></b><span data-i18n="how.s4d"></span></li></ol></div>
  </section>

  <section class="lp-final reveal">
    <div class="lp-light l1"></div><div class="lp-light l2"></div>
    <div class="lp-final-text"><h2><span data-i18n="lp.final_a"></span><em data-i18n="lp.final_b"></em></h2><p data-i18n="lp.final_sub"></p>
      <div class="lp-cta"><a class="lp-btn big" href="/auth.html#register"><span data-i18n="nav.register"></span> ›</a><a class="lp-btn big ghost" href="/advisor.html" data-i18n="home.adv_cta"></a></div></div>
    <img class="lp-final-car" src="/img/auth/malibu_black.png" alt="" loading="lazy">
  </section>

  <footer class="lp-foot"><b>CAR<span>RENT</span></b><a href="/cars.html" data-i18n="nav.cars"></a><a href="/advisor.html" data-i18n="nav.advisor"></a>
    <a href="/info.html" data-i18n="nav.info"></a><a href="/info.html#faq" data-i18n="lp.faq"></a><a href="/info.html#contact" data-i18n="lp.contact"></a><span>© 2026 CarRent</span></footer>
</div>

<main id="homeMain">
  <section class="hero photo">
    <div class="hero-bg" aria-hidden="true"></div>
    <div class="container hero-inner">
      <span class="eyebrow light" data-i18n="home.eyebrow"></span>
      <h1 data-i18n="home.title"></h1>
      <p class="lead" data-i18n="home.lead"></p>
      <div class="row">
        <a class="btn btn-lg btn-white" href="/cars.html" data-i18n="home.cta_find"></a>
        <a class="btn btn-lg btn-glass" href="/car-form.html" data-i18n="home.cta_earn"></a>
      </div>
      <div class="hero-badges" id="heroStats"></div>
    </div>
    <div class="container">
      <form class="card searchbar" id="searchForm" role="search" action="/cars.html">
        <div class="field"><label for="city" data-i18n="search.where"></label><select class="input" id="city" name="city"><option value="" data-i18n="search.any_city"></option></select></div>
        <div class="field"><label for="start" data-i18n="search.start"></label><input class="input" type="date" id="start" name="start"></div>
        <div class="field"><label for="end" data-i18n="search.end"></label><input class="input" type="date" id="end" name="end"></div>
        <div class="field"><label for="body_type" data-i18n="search.type"></label>
          <select class="input" id="body_type" name="body_type"><option value="" data-i18n="common.any"></option>
            <option value="sedan" data-i18n="body.sedan"></option><option value="hatchback" data-i18n="body.hatchback"></option>
            <option value="crossover" data-i18n="body.crossover"></option><option value="suv" data-i18n="body.suv"></option>
            <option value="minivan" data-i18n="body.minivan"></option><option value="pickup" data-i18n="body.pickup"></option><option value="coupe" data-i18n="body.coupe"></option></select></div>
        <div class="field"><label for="max_price" data-i18n="search.price"></label>
          <select class="input" id="max_price" name="max_price"><option value="" data-i18n="common.any"></option>
            <option value="300000" data-i18n="search.upto300"></option><option value="600000" data-i18n="search.upto600"></option><option value="1000000" data-i18n="search.upto1m"></option></select></div>
        <button class="btn btn-lg" type="submit" data-i18n="search.submit"></button>
      </form>
    </div>
  </section>

  <section class="section" id="recoSection">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow" data-i18n="home.reco_eyebrow"></span><h2 id="recoTitle" data-i18n="home.popular"></h2>
        <p id="recoSub" data-i18n="home.popular_sub"></p></div><a class="btn btn-outline" href="/cars.html" data-i18n="home.all_cars"></a></div>
      <div class="cars-grid" id="reco"></div>
      <a class="adv-promo" href="/advisor.html"><img class="adv-promo-ico" src="/img/adv/compass.png" alt="" width="52" height="52">
        <span><b data-i18n="home.adv_t"></b><span class="small" data-i18n="home.adv_b"></span></span><span class="btn btn-sm" data-i18n="home.adv_cta"></span></a>
    </div>
  </section>

  <section class="section alt">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow" data-i18n="how.eyebrow"></span><h2 data-i18n="how.title"></h2></div>
        <a class="btn btn-outline" href="/info.html#how" data-i18n="home.more_info"></a></div>
      <div class="steps">
        <div class="card step"><h3 data-i18n="how.s1"></h3><p data-i18n="how.s1d"></p></div>
        <div class="card step"><h3 data-i18n="how.s2"></h3><p data-i18n="how.s2d"></p></div>
        <div class="card step"><h3 data-i18n="how.s3"></h3><p data-i18n="how.s3d"></p></div>
        <div class="card step"><h3 data-i18n="how.s4"></h3><p data-i18n="how.s4d"></p></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow" data-i18n="regions.eyebrow"></span><h2 data-i18n="regions.title"></h2></div></div>
      <div class="regions" id="regions"></div>
    </div>
  </section>

  <section class="section alt">
    <div class="container">
      <div class="section-head"><div><span class="eyebrow" data-i18n="reviews.eyebrow"></span><h2 data-i18n="reviews.title"></h2><p data-i18n="reviews.sub"></p></div></div>
      <div class="testimonials" id="testimonials"></div>
    </div>
  </section>

  <section class="section">
    <div class="container"><div class="cta">
      <div><h2 data-i18n="cta.title"></h2><p data-i18n="cta.sub"></p><p class="small" id="commissionLine" style="margin-top:6px"></p></div>
      <a class="btn btn-lg" href="/car-form.html" data-i18n="cta.btn"></a>
    </div></div>
  </section>
</main>
<script src="/js/app.js"></script>
<script src="/js/pages/landing.js"></script>
<script src="/js/pages/home.js"></script>
</body>
</html>
