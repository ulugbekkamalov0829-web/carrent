# Render.com Blueprint — "New > Blueprint" orqali shu repozitoriyni tanlang
services:
  - type: web
    name: carrent
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: SEED_DEMO
        value: "false"
      - key: DEMO_MODE
        value: "false"
      # Doimiy saqlash (bepul): Supabase Storage. Render panelida qo'shing (qiymatlarni bu faylga YOZMANG):
      #   SUPABASE_URL          = https://<loyiha>.supabase.co
      #   SUPABASE_SERVICE_KEY  = Supabase > Project Settings > API Keys > secret (service_role) kalit
      #   ADMIN_EMAILS          = sizning emailingiz (tasdiqlangach admin bo'ladi)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
